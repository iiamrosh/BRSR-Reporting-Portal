services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brsr_nexus}
      POSTGRES_USER: ${POSTGRES_USER:-brsr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brsr}
    ports:
      - "5432:5432"
    volumes:
      - brsr_nexus_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brsr} -d ${POSTGRES_DB:-brsr_nexus}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://brsr:brsr@db:5432/brsr_nexus}
      ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_ROOT: /data/evidence
    volumes:
      - brsr_nexus_evidence:/data/evidence
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  brsr_nexus_data:
  brsr_nexus_evidence:
